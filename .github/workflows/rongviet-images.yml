# RongViet fork: build the three front-end images (web, admin, space) with RongViet branding
# and push them to GitHub Container Registry. api / live / proxy keep using the official
# makeplane images because this fork does not change them.
name: RongViet images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PLANE_VERSION: v1.4.2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: ./apps/web/Dockerfile.web
          - app: admin
            dockerfile: ./apps/admin/Dockerfile.admin
          - app: space
            dockerfile: ./apps/space/Dockerfile.space
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/plane-rongviet-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ env.PLANE_VERSION }}-rv
            ${{ steps.meta.outputs.image }}:${{ env.PLANE_VERSION }}-rv-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Plane ${{ env.PLANE_VERSION }} ${{ matrix.app }} with RongViet branding
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
